version: "3"

dotenv: [".env"]

vars:
  BINARY: lazycloud
  LOCALSTACK_ENDPOINT: http://localhost:4566
  # The golangci-lint version that CI uses. Keep it equal to the version in
  # .github/workflows/security.yml.
  GOLANGCI_LINT_VERSION: 2.14.0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ─── Build ──────────────────────────────────────────────

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"

  # ─── Development ────────────────────────────────────────

  dev:
    desc: Run the app against LocalStack
    deps: [localstack:up]
    cmds:
      - go run . --endpoint {{.LOCALSTACK_ENDPOINT}}
    env: &localstack-env
      AWS_ENDPOINT_URL: "{{.LOCALSTACK_ENDPOINT}}"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

  dev:watch:
    desc: Rebuild and run on file changes
    deps: [localstack:up]
    cmds:
      - task: build
      - ./{{.BINARY}} --endpoint {{.LOCALSTACK_ENDPOINT}}
    watch: true
    sources:
      - ./**/*.go
    env: *localstack-env

  run:
    desc: Run the app against real AWS (uses default profile)
    deps: [build]
    cmds:
      - ./{{.BINARY}}

  # ─── Testing ────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  test:race:
    desc: Run all tests like CI (race detector, random order)
    cmds:
      - go test -race -shuffle=on ./...

  cover:
    desc: Run all tests and show the coverage per function
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool cover -func=cover.out

  vuln:
    desc: Scan for known vulnerabilities (govulncheck, pinned in go.mod)
    cmds:
      - go tool govulncheck ./...

  test:integration:
    desc: Run integration tests against LocalStack
    deps: [localstack:up, localstack:seed]
    cmds:
      - go test ./... -v -tags=integration
    env: *localstack-env

  # ─── Linting ────────────────────────────────────────────

  lint:
    desc: Run linter (needs the golangci-lint version of CI)
    preconditions:
      - sh: '[ "$(golangci-lint version --short 2>/dev/null)" = "{{.GOLANGCI_LINT_VERSION}}" ]'
        msg: "task lint needs golangci-lint {{.GOLANGCI_LINT_VERSION}}, the version that CI uses. Install that version, for example with mise."
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - gofmt -s -w .
      - goimports -w .

  # ─── LocalStack ─────────────────────────────────────────

  localstack:up:
    desc: Start LocalStack
    cmds:
      - docker compose up -d
      - echo "Waiting for LocalStack to be ready..."
      - bash -c 'for i in $(seq 1 60); do curl -s http://localhost:4566/_localstack/health | grep -q "available" && exit 0; sleep 1; done; echo "LocalStack failed to start" && exit 1'
      - echo "LocalStack is ready."
    status:
      - docker compose ps --status running --format '{{.Name}}' | grep -q localstack

  localstack:down:
    desc: Stop LocalStack
    cmds:
      - docker compose down

  localstack:wipe:
    desc: Wipe all LocalStack data without stopping it
    cmds:
      - go run ./cmd/seed/ --wipe
    env: *localstack-env

  localstack:reset:
    desc: Stop LocalStack and wipe all data
    cmds:
      - docker compose down -v

  localstack:seed:
    desc: Seed LocalStack with test data
    cmds:
      - go run ./cmd/seed/ {{.CLI_ARGS}}
    env: *localstack-env

  localstack:logs:
    desc: Tail LocalStack logs
    cmds:
      - docker compose logs -f localstack

  # ─── Housekeeping ───────────────────────────────────────

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -rf .task/
      - rm -rf dist/

  deps:
    desc: Download and tidy dependencies
    cmds:
      - go mod download
      - go mod tidy

  # ─── Demo ───────────────────────────────────────────────

  demo:
    desc: Record demo/demo.gif with VHS in Docker (needs LocalStack with the seed data)
    cmds:
      - CGO_ENABLED=0 GOOS=linux go build -o demo/lazycloud .
      - defer: rm -f demo/lazycloud
      - >-
        docker run --rm --network host --user "$(id -u):$(id -g)"
        -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test -e AWS_DEFAULT_REGION=us-east-1
        -v "$PWD:/vhs" ghcr.io/charmbracelet/vhs:v0.12.1 demo/demo.tape

  # ─── Release ────────────────────────────────────────────

  snapshot:
    desc: Build cross-platform binaries locally (requires goreleaser)
    cmds:
      - goreleaser build --snapshot --clean

  release:
    desc: "Tag and push a new release (usage: task release -- v0.1.0)"
    cmds:
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
