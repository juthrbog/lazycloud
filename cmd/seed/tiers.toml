# Seed tier configuration for LazyCloud LocalStack development.
#
# [base] defines named resources that are always seeded (regardless of tier).
# [tiers.*] defines extra generated resources per tier on top of base.

# ─── Base Resources (always seeded) ──────────────────────────────────────────

[[base.s3.buckets]]
name = "test-bucket-1"

[[base.s3.buckets]]
name = "test-bucket-2"

[[base.s3.buckets]]
name = "logs-bucket"

[[base.ec2.vpcs]]
name = "main-vpc"
cidr = "10.0.0.0/16"
tenancy = "default"

[[base.ec2.vpcs]]
name = "staging-vpc"
cidr = "10.1.0.0/16"
tenancy = "default"

[[base.ec2.subnets]]
name = "main-public-1a"
vpc_ref = "main-vpc"
cidr = "10.0.1.0/24"
az = "us-east-1a"
public = true

[[base.ec2.subnets]]
name = "main-public-1b"
vpc_ref = "main-vpc"
cidr = "10.0.2.0/24"
az = "us-east-1b"
public = true

[[base.ec2.subnets]]
name = "main-private-1a"
vpc_ref = "main-vpc"
cidr = "10.0.10.0/24"
az = "us-east-1a"

[[base.ec2.subnets]]
name = "main-private-1b"
vpc_ref = "main-vpc"
cidr = "10.0.11.0/24"
az = "us-east-1b"

[[base.ec2.subnets]]
name = "staging-public-1a"
vpc_ref = "staging-vpc"
cidr = "10.1.1.0/24"
az = "us-east-1a"
public = true

[[base.ec2.subnets]]
name = "staging-private-1a"
vpc_ref = "staging-vpc"
cidr = "10.1.10.0/24"
az = "us-east-1a"

[[base.ec2.amis]]
name = "lazycloud-amazonlinux2-x86_64"
architecture = "x86_64"

[[base.ec2.amis]]
name = "lazycloud-ubuntu2204-x86_64"
architecture = "x86_64"

[[base.ec2.amis]]
name = "lazycloud-ubuntu2204-arm64"
architecture = "arm64"

[[base.ec2.amis]]
name = "lazycloud-minimal-x86_64"
architecture = "x86_64"

[[base.ec2.security_groups]]
name = "web-sg"
description = "Web server security group"
vpc_ref = "main-vpc"

  [[base.ec2.security_groups.inbound]]
  protocol = "tcp"
  from_port = 80
  to_port = 80
  cidr = "0.0.0.0/0"
  description = "HTTP"

  [[base.ec2.security_groups.inbound]]
  protocol = "tcp"
  from_port = 443
  to_port = 443
  cidr = "0.0.0.0/0"
  description = "HTTPS"

[[base.ec2.security_groups]]
name = "api-sg"
description = "API server security group"
vpc_ref = "main-vpc"

  [[base.ec2.security_groups.inbound]]
  protocol = "tcp"
  from_port = 8080
  to_port = 8080
  sg_ref = "web-sg"
  description = "API from web tier"

[[base.ec2.security_groups]]
name = "db-sg"
description = "Database security group"
vpc_ref = "main-vpc"

  [[base.ec2.security_groups.inbound]]
  protocol = "tcp"
  from_port = 5432
  to_port = 5432
  sg_ref = "api-sg"
  description = "Postgres from API tier"

[[base.ec2.security_groups]]
name = "bastion-sg"
description = "SSH bastion host"
vpc_ref = "main-vpc"

  [[base.ec2.security_groups.inbound]]
  protocol = "tcp"
  from_port = 22
  to_port = 22
  cidr = "10.0.0.0/8"
  description = "SSH from internal"

[[base.ec2.instances]]
name = "web-server-1"
ami_ref = "lazycloud-amazonlinux2-x86_64"
instance_type = "t3.micro"
sg_refs = ["web-sg"]
subnet_ref = "main-public-1a"

[[base.ec2.instances]]
name = "api-server-1"
ami_ref = "lazycloud-ubuntu2204-x86_64"
instance_type = "t3.small"
sg_refs = ["api-sg"]
subnet_ref = "main-private-1a"

[[base.ec2.instances]]
name = "db-primary"
ami_ref = "lazycloud-ubuntu2204-x86_64"
instance_type = "t3.medium"
stopped = true
sg_refs = ["db-sg"]
subnet_ref = "main-private-1b"

[[base.ec2.instances]]
name = "worker-arm-1"
ami_ref = "lazycloud-ubuntu2204-arm64"
instance_type = "t4g.micro"
sg_refs = ["web-sg"]
subnet_ref = "main-public-1b"

[[base.ec2.instances]]
name = "old-bastion"
ami_ref = "lazycloud-minimal-x86_64"
instance_type = "t2.micro"
stopped = true
sg_refs = ["bastion-sg"]
subnet_ref = "staging-public-1a"

[[base.sqs.queues]]
name = "order-processing"
dlq_ref = "order-processing-dlq"
max_receive_count = 5
seed_messages = 8

[[base.sqs.queues]]
name = "order-processing-dlq"
seed_messages = 3

[[base.sqs.queues]]
name = "notifications"
seed_messages = 5

[[base.sqs.queues]]
name = "analytics-events"

[[base.sqs.queues]]
name = "payment-processing.fifo"
fifo = true
seed_messages = 4

[[base.sqs.queues]]
name = "audit-log.fifo"
fifo = true

# CloudWatch Logs. One stream has 2,500 events, so the event viewer must
# page back. One group has no streams. The events cover the 50 minutes
# before the seed run.

[[base.logs.groups]]
name = "/aws/lambda/orders-api"
retention_days = 30
tags = { team = "orders", env = "dev" }
streams = [
  { name = "2026/11/20/[$LATEST]a1b2c3", events = 2500 },
  { name = "2026/11/20/[$LATEST]d4e5f6", events = 120 },
  # Invocations of the seeded function orders-api, with REPORT lines.
  { name = "2026/11/21/[$LATEST]f7a8b9", events = 60, kind = "lambda_text" },
]

# The JSON log format of the seeded function thumbnailer, with
# SystemLogLevel WARN: only failed invocations write a report.
[[base.logs.groups]]
name = "/aws/lambda/thumbnailer"
streams = [
  { name = "2026/11/21/[$LATEST]c0ffee", events = 60, kind = "lambda_json_warn" },
]

[[base.logs.groups]]
name = "/ecs/web"
retention_days = 7
streams = [
  { name = "web/app/1", events = 300 },
  { name = "web/app/2", events = 300 },
]

[[base.logs.groups]]
name = "/aws/apigateway/access"
streams = [{ name = "access", events = 50 }]

[[base.logs.groups]]
name = "/empty/group"

# Lambda. The functions are never invoked; the logs seeder writes their
# log lines. orders-api has versions, a weighted alias and an SQS trigger.

[[base.lambda.functions]]
name = "orders-api"
runtime = "python3.12"
description = "Takes orders"
memory = 256
timeout = 30
env = { DB_HOST = "orders.db.internal", DB_PASSWORD = "not-a-real-secret" }
tags = { team = "orders" }
versions = 2
alias = { name = "live", version = "1", description = "production", weight_version = "2", weight = 0.1 }
sqs_trigger = "orders-api-jobs"

[[base.lambda.functions]]
name = "thumbnailer"
runtime = "python3.12"
description = "Makes thumbnails"
memory = 1024
timeout = 60
log_format = "JSON"
system_log_level = "WARN"

[[base.lambda.functions]]
name = "report-builder"
runtime = "python3.12"
description = "Writes to a custom log group"
log_group = "/custom/report-builder"

[[base.lambda.functions]]
name = "legacy-image"
description = "An image function"
image_uri = "000000000000.dkr.ecr.us-east-1.amazonaws.com/legacy:latest"

# ECS. Each running task is a Docker container on the host, so only web
# runs a task. The seeder runs one more task of web and stops it, for the
# stopped task list. No service crashes: LocalStack would start a new
# container every few seconds.

[[base.ecs.clusters]]
name = "prod-cluster"
tags = { team = "platform" }

[[base.ecs.clusters.services]]
name = "web"
image = "nginx:alpine"
desired = 1
exec = true
log_group = "/ecs/web-app"
env = { DB_HOST = "web.db.internal", DB_PASSWORD = "not-a-real-secret" }
tags = { team = "web" }
stopped_task = true

[[base.ecs.clusters.services]]
name = "worker"
image = "nginx:alpine"
revisions = 2
log_group = "/ecs/worker"

[[base.ecs.clusters.services]]
name = "scheduler"
image = "nginx:alpine"
revisions = 2

# ─── Tier: small ─────────────────────────────────────────────────────────────
# Base resources only, no extras. Default for quick dev iteration.

[tiers.small]

# ─── Tier: medium ────────────────────────────────────────────────────────────
# Realistic browsing with 20-50 resources per type.

[tiers.medium.logs]
extra_groups = 20
streams_per_extra_group = 2

[tiers.medium.lambda]
extra_functions = 60

[tiers.medium.ecs]
extra_services = 30

[tiers.medium.sqs]
extra_queues = 10

[tiers.medium.s3]
extra_buckets = 10
objects_per_extra_bucket = 5

[tiers.medium.ec2]
extra_vpcs = 3
extra_amis = 4
extra_instances = 15
stop_fraction = 0.3
extra_sgs = 5

# ─── Tier: large ─────────────────────────────────────────────────────────────
# Pagination and progressive loading testing.

[tiers.large.logs]
extra_groups = 120
streams_per_extra_group = 2

[tiers.large.lambda]
extra_functions = 120

[tiers.large.ecs]
extra_services = 120

[tiers.large.sqs]
extra_queues = 50

[tiers.large.s3]
extra_buckets = 50
objects_per_extra_bucket = 20

[tiers.large.ec2]
extra_vpcs = 10
extra_amis = 10
extra_instances = 200
stop_fraction = 0.25
extra_sgs = 20

# ─── Tier: enterprise ────────────────────────────────────────────────────────
# Performance stress testing.

[tiers.enterprise.logs]
extra_groups = 1200
streams_per_extra_group = 2

[tiers.enterprise.lambda]
extra_functions = 1100

[tiers.enterprise.ecs]
extra_services = 1100

[tiers.enterprise.sqs]
extra_queues = 200

[tiers.enterprise.s3]
extra_buckets = 200
objects_per_extra_bucket = 50

[tiers.enterprise.ec2]
extra_vpcs = 25
extra_amis = 20
extra_instances = 1000
stop_fraction = 0.2
extra_sgs = 50
