name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA. Dependabot updates the SHA and
      # the version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod sets the minimum Go version. Build and scan with the latest
          # patch of that minor version, so standard library fixes apply.
          go-version: "1.26.x"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The release archives also cover macOS and Windows.
      - name: Vet for macOS and Windows
        run: |
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      # The race detector finds data races between Update and command
      # goroutines. A random test order finds tests that depend on global
      # state, for example the ReadOnly mode or the event log.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=cover.out ./...

      - name: Coverage
        run: go tool cover -func=cover.out | tail -1
