name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear while the code stays the same. Scan main every
  # Monday, off the hour, because GitHub delays runs at the start of the hour.
  # GitHub sends a failed scheduled run to the user who last changed the cron.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  golangci-lint:
    name: Lint & SAST
    # The weekly run looks for new advisories. This job uses no advisory data.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # go.mod sets the minimum Go version. Build and scan with the latest
          # patch of that minor version, so standard library fixes apply.
          go-version: "1.26.x"
          check-latest: true

      # golangci-lint with gosec enabled for Go-specific security patterns
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # go.mod sets the minimum Go version. Build and scan with the latest
          # patch of that minor version, so standard library fixes apply.
          go-version: "1.26.x"
          check-latest: true

      # Official Go vulnerability scanner with call-graph analysis
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  trivy:
    name: Trivy (SCA + Secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Trivy filesystem scan — pinned to SHA due to March 2026 supply chain attack
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Secret Detection
    # The weekly run looks for new advisories. This job uses no advisory data.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Gitleaks scans for leaked secrets in git history
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
